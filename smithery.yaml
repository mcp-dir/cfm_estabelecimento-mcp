# Smithery configuration for Conselho Federal de Medicina: Estabelecimentos de Saúde
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_cfm_estabelecimento

name: cfm_estabelecimento-mcp
displayName: "Conselho Federal de Medicina: Estabelecimentos de Saúde"
description: >
  Conselho Federal de Medicina: Estabelecimentos de Saúde, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/cfm_estabelecimento-mcp
repository: https://github.com/mcp-dir/cfm_estabelecimento-mcp

tags:
  - cfm_estabelecimento
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_cfm_estabelecimento

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_cfm_estabelecimento/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
